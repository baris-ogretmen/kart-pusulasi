<style>
:root{--bg:#f3f6f6;--kart:#fff;--yazi:#10201f;--soluk:#5b6b6a;--cizgi:#e1e8e7;--ana:#0f766e;--ana2:#0e4f63;--kirmizi:#dc2626;--turuncu:#ea580c;--sari:#ca8a04;--yesil:#16a34a;--fs:16px}
body.koyu{--bg:#0d1514;--kart:#17211f;--yazi:#e8f0ef;--soluk:#9db0ae;--cizgi:#26332f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--yazi);font:var(--fs)/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none;overflow-x:hidden}
button{font:inherit;cursor:pointer;user-select:none;-webkit-user-select:none;border:0;border-radius:14px;min-height:44px;padding:10px 14px;transition:transform .1s}
button:active{transform:scale(.95)}
input,select,textarea{font-size:16px;font-family:inherit;width:100%;padding:12px;border:1.5px solid var(--cizgi);border-radius:12px;background:var(--kart);color:var(--yazi)}
label{display:block;font-size:.88em;color:var(--soluk);margin:10px 0 4px}
#ust{position:sticky;top:0;z-index:20;background:var(--ana);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 16px 12px;display:flex;align-items:center;gap:10px}
#ust img{width:34px;height:34px;border-radius:9px}
#ust h1{font-size:1.15em;margin:0;flex:1}
.rozet{font-size:.78em;background:rgba(255,255,255,.18);padding:4px 9px;border-radius:20px;min-height:0}
main{padding:14px 14px calc(96px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
.sayfa{display:none}.sayfa.aktif{display:block}
.k{background:var(--kart);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.k h2{font-size:1.05em;margin:0 0 10px}
.soluk{color:var(--soluk);font-size:.9em}
.buyuk{font-size:1.8em;font-weight:800;letter-spacing:-.5px}
.satir{display:flex;align-items:center;gap:10px}
.ara{justify-content:space-between}
.btn{background:var(--ana);color:#fff;font-weight:700;width:100%}
.btn2{background:var(--cizgi);color:var(--yazi);font-weight:600}
.btnk{background:#fee2e2;color:#991b1b;font-weight:600}
.olay{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--cizgi)}
.olay:first-child{border-top:0}
.tarih{min-width:54px;text-align:center;border-radius:12px;padding:6px 4px;background:var(--bg);font-weight:800;line-height:1.1}
.tarih small{display:block;font-weight:600;font-size:.7em;color:var(--soluk)}
.serit{width:6px;align-self:stretch;border-radius:4px}
.etiket{display:inline-block;font-size:.75em;font-weight:700;padding:2px 8px;border-radius:20px}
.e-gecikti{background:#fee2e2;color:#991b1b}.e-acil{background:#ffedd5;color:#9a3412}.e-yakin{background:#fef9c3;color:#854d0e}.e-normal{background:#dcfce7;color:#166534}.e-tamam{background:#dcfce7;color:#166534}.e-faiz{background:#ffedd5;color:#9a3412}.e-bekliyor{background:#e0f2fe;color:#075985}
.uyari{border-left:6px solid var(--kirmizi);background:#fff1f1;color:#7f1d1d}
body.koyu .uyari{background:#2a1414;color:#fecaca}
.iyi{border-left:6px solid var(--yesil)}
.kartk{border-radius:18px;padding:16px;color:#fff;margin-bottom:10px}
.kartk .ust2{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.cubuk{height:8px;border-radius:6px;background:rgba(255,255,255,.3);overflow:hidden;margin:10px 0}
.cubuk i{display:block;height:100%;background:#fff}
.izgara{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-size:.92em}
.dugmeler{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.dugmeler button{flex:1;min-width:90px;background:rgba(255,255,255,.2);color:#fff;font-weight:700}
#alt{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--kart);border-top:1px solid var(--cizgi);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
#alt button{flex:1;background:none;color:var(--soluk);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72em;padding:6px 0;border-radius:12px}
#alt button b{font-size:1.5em;line-height:1}
#alt button.sec{color:var(--ana);font-weight:800;background:rgba(15,118,110,.1)}
#perde{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:none;align-items:flex-end;justify-content:center}
#perde.acik{display:flex}
#sayfaAlt{background:var(--kart);width:100%;max-width:640px;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));background:#111;color:#fff;padding:10px 16px;border-radius:14px;z-index:60;display:none;max-width:90%;text-align:center}
#cevrim{display:none;background:#78350f;color:#fff;text-align:center;font-size:.85em;padding:4px}
#yeniSurum{display:none;background:var(--ana2);color:#fff;text-align:center;padding:8px}
#acilis{position:fixed;inset:0;background:linear-gradient(135deg,#0f766e,#0e4f63);z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;transition:opacity .3s}
#acilis img{width:96px;height:96px;border-radius:24px;margin-bottom:12px}
.secim{display:flex;gap:6px;flex-wrap:wrap}
.secim button{background:var(--bg);color:var(--yazi);font-weight:600;padding:8px 12px;min-height:40px}
.secim button.sec{background:var(--ana);color:#fff}
.tablo{width:100%;border-collapse:collapse;font-size:.92em}
.tablo td{padding:8px 4px;border-top:1px solid var(--cizgi)}
.tablo td:last-child{text-align:right;font-weight:700}
.anahtar{display:flex;justify-content:space-between;align-items:center;padding:8px 0}
.hat{border:1px solid var(--cizgi);border-radius:14px;padding:10px;margin:8px 0}
.renkler{display:flex;gap:8px;flex-wrap:wrap}
.renkler button{width:40px;height:40px;min-height:40px;padding:0;border-radius:50%;border:3px solid transparent}
.renkler button.sec{border-color:var(--yazi)}
@media (min-width:520px){.izgara{grid-template-columns:1fr 1fr 1fr}}
</style>

<script>
/* ===== Kart Pusulası — Barış Öğretmen ===== */
var SURUM=1;
var YENILIKLER=['Bütün kartların tek ekranda, en acil ödeme en üstte','“Hangi karttan nakit avans?” akıllı önerisi ve gerçek maliyet hesabı','Aylık plan: gelir, kira ve asgari ödemeler tek bakışta','Kasa üzerinden ödeme günü bildirimleri + takvime ekleme'];
var KASA='https://baris-kasa.barilkay466.workers.dev';
var UYG='kartpusula';
var VAPID='BIXVUEpl8HJuKI61AtSnjS3WTdVvW7-TZeCZUTwJyw1Gd5hxFrUMvt95U_LHmEplAhaf9hqF0tS7zX3JRAcUfEk';
var AYLAR=['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
var GUNLER=['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];
var RENKLER=['#0b4ea2','#dc0005','#00855f','#7a1a54','#00a651','#8e3a8a','#004990','#1f2937','#c2410c','#0f766e'];

function kasa(){try{var u=localStorage.getItem('zkasa_url');if(u)return u.replace(/\/+$/,'');}catch(e){}return KASA;}
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}catch(e){return null;}}

/* ---------- veri ---------- */
var BOS={kartlar:[],gelir:{maas:0,ek:0},gider:{kira:0,diger:0},ayar:{faiz:4.25,vergi:30,komisyon:5,makas:2},odemeler:[]};
var V;
function yukle(){try{V=JSON.parse(ls('kp_veri')||'null');}catch(e){V=null;}if(!V)V=JSON.parse(JSON.stringify(BOS));
  ['gelir','gider','ayar'].forEach(function(k){V[k]=Object.assign({},BOS[k],V[k]||{});});V.kartlar=V.kartlar||[];V.odemeler=V.odemeler||[];}
function kaydet(){ls('kp_veri',JSON.stringify(V));otoHatirlatmaPlanla();}
function yeniId(){return 'k'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);}

/* ---------- sayı & tarih ---------- */
function sayi(s){if(typeof s==='number')return s;s=String(s||'').replace(/\s|TL|₺/gi,'');if(!s)return 0;
  if(s.indexOf(',')>=0)s=s.replace(/\./g,'').replace(',','.');else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');var n=parseFloat(s);return isNaN(n)?0:n;}
function tl(n,ond){return (Number(n)||0).toLocaleString('tr-TR',{minimumFractionDigits:ond?2:0,maximumFractionDigits:ond?2:0})+' TL';}
function bugun(){var d=new Date();d.setHours(0,0,0,0);return d;}
function tarihOku(s){if(!s)return null;var p=String(s).split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function tarihYaz(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function gunFark(d){return Math.round((d-bugun())/864e5);}
function trTarih(d,gunlu){return d.getDate()+' '+AYLAR[d.getMonth()]+(gunlu?' '+GUNLER[d.getDay()]:'');}
function ayinGunu(y,m,g){var son=new Date(y,m+1,0).getDate();return new Date(y,m,Math.min(g,son));}
function sonrakiGun(g,sonra){var d=ayinGunu(sonra.getFullYear(),sonra.getMonth(),g);if(d<=sonra)d=ayinGunu(sonra.getFullYear(),sonra.getMonth()+1,g);return d;}
function kalanYazi(n){if(n<0)return Math.abs(n)+' gün geçti';if(n===0)return 'BUGÜN';if(n===1)return 'yarın';return n+' gün kaldı';}

/* ---------- kart mantığı ---------- */
function oran(c){return (c.limit||0)>50000?0.40:0.20;}
function tahminiAsgari(c){var b=c.tahminiEkstre!=null&&c.tahminiEkstre!==''?sayi(c.tahminiEkstre):c.toplamBorc;return Math.max(0,Math.round(b*oran(c)));}
function durum(c){
  var t=tarihOku(c.sonOdeme),d=t?gunFark(t):99;
  if(c.ekstreBekleniyor)return{tip:d<0?'faiz':'bekliyor',d:d,yazi:'Ekstre bekleniyor'};
  if((c.kalanEkstre||0)<=0.5)return{tip:'tamam',d:d,yazi:'✅ Ödendi'};
  if(d<0){if(c.kalanAsgari==null||c.kalanAsgari==='')return{tip:'gecikti',d:d,yazi:'⚠️ Asgari ödendi mi? Kontrol et',bilinmiyor:true};
    if(c.kalanAsgari>0.5)return{tip:'gecikti',d:d,yazi:'⛔ GECİKMİŞ — asgari ödenmedi'};
    return{tip:'faiz',d:d,yazi:'🟠 Asgari ödendi, kalan faizleniyor'};}
  if(d<=3)return{tip:'acil',d:d,yazi:'🔴 '+kalanYazi(d)};
  if(d<=7)return{tip:'yakin',d:d,yazi:'🟡 '+kalanYazi(d)};
  return{tip:'normal',d:d,yazi:'🟢 '+kalanYazi(d)};
}
function olaylar(){
  var L=[],b=bugun();
  V.kartlar.forEach(function(c){
    var s=durum(c),t=tarihOku(c.sonOdeme);
    if(s.tip==='gecikti'){L.push({c:c,tarih:t,tutar:s.bilinmiyor?c.kalanEkstre:c.kalanAsgari,tam:c.kalanEkstre,tip:'gecikti',bilinmiyor:s.bilinmiyor});
      L.push({c:c,tarih:sonrakiGun(c.odemeGunu,b),tutar:tahminiAsgari(c),tam:c.toplamBorc,tahmini:true});}
    else if(s.tip==='faiz'||(s.tip==='tamam'&&s.d<0)){L.push({c:c,tarih:sonrakiGun(c.odemeGunu,b),tutar:tahminiAsgari(c),tam:c.toplamBorc,tahmini:true});}
    else if(s.tip==='tamam'){L.push({c:c,tarih:sonrakiGun(c.odemeGunu,t),tutar:tahminiAsgari(c),tam:c.toplamBorc,tahmini:true});}
    else if(s.tip==='bekliyor'){L.push({c:c,tarih:t,tutar:tahminiAsgari(c),tam:c.tahminiEkstre!=null&&c.tahminiEkstre!==''?sayi(c.tahminiEkstre):c.toplamBorc,tahmini:true});}
    else L.push({c:c,tarih:t,tutar:c.kalanAsgari!=null&&c.kalanAsgari!==''?c.kalanAsgari:tahminiAsgari(c),tam:c.kalanEkstre});
  });
  L.forEach(function(o){o.d=gunFark(o.tarih);if(!o.tip)o.tip=o.d<=3?'acil':o.d<=7?'yakin':'normal';});
  L.sort(function(a,b){if(a.tip==='gecikti'&&b.tip!=='gecikti')return -1;if(b.tip==='gecikti'&&a.tip!=='gecikti')return 1;return a.tarih-b.tarih;});
  return L;
}
function toplamlar(){var t={borc:0,limit:0,kul:0};V.kartlar.forEach(function(c){t.borc+=+c.toplamBorc||0;t.limit+=+c.limit||0;t.kul+=+c.kullanilabilir||0;});return t;}

/* ---------- ekranlar ---------- */
function olaySatiri(o,tus){
  var c=o.c,etk=o.tip==='gecikti'?(o.bilinmiyor?'Kontrol et':'GECİKMİŞ'):kalanYazi(o.d);
  return '<div class="olay"><div class="tarih">'+o.tarih.getDate()+'<small>'+AYLAR[o.tarih.getMonth()].slice(0,3)+'</small></div>'+
  '<div class="serit" style="background:'+esc(c.renk||'#0f766e')+'"></div>'+
  '<div style="flex:1;min-width:0"><b>'+esc(c.banka)+'</b> <span class="etiket e-'+o.tip+'">'+etk+'</span><br>'+
  '<span class="soluk">'+(o.tip==='gecikti'&&o.bilinmiyor?'Kalan ekstre ':'Asgari'+(o.tahmini?' (tahmini)':'')+' ')+'</span><b>'+tl(o.tutar)+'</b>'+

function avansOneri(tutar){
  var b=bugun();

    var s=durum(c),yeter=(+c.kullanilabilir||0)>=tutar,kotu=s.tip==='gecikti';
    var kesim=sonrakiGun(c.kesimGunu,new Date(b.getTime()-864e5)),ilkOdeme=sonrakiGun(c.odemeGunu,kesim),nefes=gunFark(ilkOdeme);
    var puan=(yeter?1000:0)-(kotu?600:0)+nefes*6+Math.min(+c.kullanilabilir||0,200000)/2500;
    var neden=[];
    if(!yeter)neden.push('⛔ Limit yetmez ('+tl(c.kullanilabilir)+')');

    if(yeter&&!kotu)neden.push('✅ İlk taksit '+trTarih(ilkOdeme)+' ödemesine girer · '+nefes+' gün nefes');
    if(yeter)neden.push('Kullanılabilir '+tl(c.kullanilabilir));

  }).sort(function(a,b){return b.puan-a.puan;});

function kapat(){$('perde').classList.remove('acik');}
var toastZ;function toast(m){var t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toastZ);toastZ=setTimeout(function(){t.style.display='none';},3000);}
function kartBul(id){return V.kartlar.filter(function(c){return c.id===id;})[0];}

function odeAc(id){var c=kartBul(id);if(!c)return;var s=durum(c),asg=c.ekstreBekleniyor?tahminiAsgari(c):(c.kalanAsgari||0),tam=c.ekstreBekleniyor?c.toplamBorc:c.kalanEkstre;
  ac('<h2 style="margin-top:0">✓ '+esc(c.banka)+' — ödeme</h2><label for="odT">Ne kadar ödedin?</label><input id="odT" inputmode="decimal" placeholder="0">'+
  '<div class="secim" style="margin-top:8px">'+(asg?'<button onclick="$(\'odT\').value=\''+asg.toLocaleString('tr-TR')+'\'">Asgari '+tl(asg)+'</button>':'')+(tam?'<button onclick="$(\'odT\').value=\''+(+tam).toLocaleString('tr-TR',{maximumFractionDigits:2})+'\'">Tamamı '+tl(tam)+'</button>':'')+'</div>'+
  (s.bilinmiyor?'<div style="height:8px"></div><button class="btn2" style="width:100%" onclick="asgariOdenmis(\''+id+'\')">✅ Asgariyi zaten ödemişim</button>':'')+
  '<div style="height:12px"></div><button class="btn" onclick="odeKaydet(\''+id+'\')">💾 Kaydet</button><div style="height:8px"></div><button class="btn2" style="width:100%" onclick="kapat()">Vazgeç</button>');}
function asgariOdenmis(id){var c=kartBul(id);c.kalanAsgari=0;kaydet();kapat();yenile();toast('Kaydedildi ✅');}
function odeKaydet(id){var c=kartBul(id),t=sayi($('odT').value);if(!(t>0)){toast('Tutar yaz');return;}
  var once=JSON.stringify(c);
  if(c.ekstreBekleniyor){if(c.tahminiEkstre!=null&&c.tahminiEkstre!=='')c.tahminiEkstre=Math.max(0,sayi(c.tahminiEkstre)-t);}
  else{c.kalanEkstre=Math.max(0,(+c.kalanEkstre||0)-t);if(c.kalanAsgari!=null&&c.kalanAsgari!=='')c.kalanAsgari=Math.max(0,(+c.kalanAsgari||0)-t);}
  c.toplamBorc=Math.max(0,(+c.toplamBorc||0)-t);c.kullanilabilir=Math.min(+c.limit||Infinity,(+c.kullanilabilir||0)+t);
  V.odemeler.push({t:tarihYaz(bugun()),k:id,m:t});kaydet();kapat();yenile();
  geriAlToast(tl(t)+' ödeme kaydedildi ✅',function(){var i=V.kartlar.indexOf(c);V.kartlar[i]=JSON.parse(once);V.odemeler.pop();kaydet();yenile();});}
function geriAlToast(m,fn){var t=$('toast');t.innerHTML=esc(m)+' <button style="background:#fff;color:#111;min-height:32px;padding:4px 10px;margin-left:6px" id="gaB">↩️ Geri al</button>';t.style.display='block';$('gaB').onclick=function(){fn();t.style.display='none';};clearTimeout(toastZ);toastZ=setTimeout(function(){t.style.display='none';},5000);}
function ekstreAc(id){var c=kartBul(id),b=bugun(),sk=sonrakiGun(c.odemeGunu,b);
  ac('<h2 style="margin-top:0">🧾 '+esc(c.banka)+' — yeni ekstre</h2><p class="soluk">Banka uygulamasındaki yeni ekstreyi gir.</p>'+
  '<label>Ekstre borcu</label><input id="eB" inputmode="decimal" oninput="$(\'eA\').value=Math.round(sayi(this.value)*'+oran(c)+').toLocaleString(\'tr-TR\')">'+
  '<label>Asgari ödeme</label><input id="eA" inputmode="decimal"><label>Son ödeme tarihi</label><input id="eT" type="date" value="'+tarihYaz(sk)+'">'+
  '<label>Toplam borç (gelecek taksitler dahil)</label><input id="eTop" inputmode="decimal" value="'+(+c.toplamBorc).toLocaleString('tr-TR',{maximumFractionDigits:2})+'">'+
  '<label>Kullanılabilir limit</label><input id="eK" inputmode="decimal" value="'+(+c.kullanilabilir).toLocaleString('tr-TR',{maximumFractionDigits:2})+'">'+
  '<div style="height:12px"></div><button class="btn" onclick="ekstreKaydet(\''+id+'\')">💾 Kaydet</button><div style="height:8px"></div><button class="btn2" style="width:100%" onclick="kapat()">Vazgeç</button>');}
function ekstreKaydet(id){var c=kartBul(id),e=sayi($('eB').value);if(!(e>=0)||!$('eT').value){toast('Ekstre ve tarih gerekli');return;}
  c.kalanEkstre=e;c.kalanAsgari=sayi($('eA').value);c.sonOdeme=$('eT').value;c.toplamBorc=sayi($('eTop').value);c.kullanilabilir=sayi($('eK').value);
  c.ekstreBekleniyor=false;c.tahminiEkstre=null;var d=tarihOku(c.sonOdeme);c.odemeGunu=d.getDate();kaydet();kapat();yenile();toast('Ekstre güncellendi ✅');}
function kartDuzenle(id){var c=id?kartBul(id):{id:'',banka:'',ad:'',renk:RENKLER[V.kartlar.length%RENKLER.length],limit:0,kullanilabilir:0,toplamBorc:0,kalanEkstre:0,kalanAsgari:0,sonOdeme:'',kesimGunu:1,odemeGunu:11};
  var f=function(k,l,t){return '<label>'+l+'</label><input id="f_'+k+'" '+(t||'inputmode="decimal"')+' value="'+esc(c[k]==null?'':(typeof c[k]==='number'?c[k].toLocaleString('tr-TR',{maximumFractionDigits:2}):c[k]))+'">';};
  ac('<h2 style="margin-top:0">'+(id?'✏️ Kartı düzenle':'➕ Yeni kart')+'</h2>'+f('banka','Banka','type="text"')+f('ad','Kart adı','type="text"')+
  '<label>Renk</label><div class="renkler" id="f_renkler">'+RENKLER.map(function(r){return '<button aria-label="Renk '+r+'" class="'+(r===c.renk?'sec':'')+'" style="background:'+r+'" onclick="renkSec(this,\''+r+'\')"></button>';}).join('')+'</div><input type="hidden" id="f_renk" value="'+esc(c.renk)+'">'+
  f('limit','Kart limiti')+f('kullanilabilir','Kullanılabilir limit')+f('toplamBorc','Toplam borç')+f('kalanEkstre','Kalan ekstre borcu')+f('kalanAsgari','Kalan asgari (bilmiyorsan boş bırak)')+
  '<label>Son ödeme tarihi</label><input id="f_sonOdeme" type="date" value="'+esc(c.sonOdeme)+'">'+f('kesimGunu','Ekstre kesim günü (ayın kaçı)','inputmode="numeric"')+
  '<div style="height:12px"></div><button class="btn" onclick="kartKaydet(\''+(id||'')+'\')">💾 Kaydet</button>'+(id?'<div style="height:8px"></div><button class="btnk" style="width:100%" onclick="kartSil(\''+id+'\')">🗑️ Kartı sil</button>':'')+'<div style="height:8px"></div><button class="btn2" style="width:100%" onclick="kapat()">Vazgeç</button>');}
function renkSec(b,r){document.querySelectorAll('#f_renkler button').forEach(function(x){x.classList.remove('sec');});b.classList.add('sec');$('f_renk').value=r;}
function kartKaydet(id){var g=function(k){return $('f_'+k).value;};if(!g('banka').trim()){toast('Banka adı yaz');return;}if(!g('sonOdeme')){toast('Son ödeme tarihini seç');return;}
  var c=id?kartBul(id):{id:yeniId()};c.banka=g('banka').trim();c.ad=g('ad').trim();c.renk=g('renk');
  ['limit','kullanilabilir','toplamBorc','kalanEkstre'].forEach(function(k){c[k]=sayi(g(k));});
  c.kalanAsgari=g('kalanAsgari').trim()===''?null:sayi(g('kalanAsgari'));c.sonOdeme=g('sonOdeme');c.odemeGunu=tarihOku(c.sonOdeme).getDate();c.kesimGunu=Math.min(31,Math.max(1,parseInt(g('kesimGunu'))||1));
  if(!id)V.kartlar.push(c);kaydet();kapat();yenile();toast('Kaydedildi ✅');}
function kartSil(id){var c=kartBul(id);if(!confirm(c.banka+' kartı silinsin mi?'))return;var i=V.kartlar.indexOf(c);V.kartlar.splice(i,1);kaydet();kapat();yenile();
  geriAlToast('Kart silindi',function(){V.kartlar.splice(i,0,c);kaydet();yenile();});}

/* ---------- içe/dışa aktar ---------- */
function iceAktarAc(){ac('<h2 style="margin-top:0">📥 Kart bilgilerini yükle</h2><p class="soluk">Sana verilen metni buraya yapıştır ya da yedek dosyasını seç. Mevcut kartların yerine geçer.</p><textarea id="iA" rows="7" placeholder="{ &quot;kartlar&quot;: [ … ] }"></textarea>'+
  '<div style="height:10px"></div><button class="btn" onclick="iceAktar($(\'iA\').value)">✅ Yükle</button><div style="height:8px"></div><label class="btn2" style="display:block;text-align:center;padding:12px;border-radius:14px;color:var(--yazi);font-size:1em;font-weight:600">📂 Dosyadan seç<input type="file" accept=".json,.txt,application/json,text/plain" style="display:none" onchange="dosyaOku(this)"></label><div style="height:8px"></div><button class="btn2" style="width:100%" onclick="kapat()">Vazgeç</button>');}
function dosyaOku(inp){var f=inp.files[0];if(!f)return;var r=new FileReader();r.onload=function(){iceAktar(r.result);};r.readAsText(f);}
function iceAktar(m){try{var s=String(m||'');var a=s.indexOf('{'),b=s.lastIndexOf('}');var d=JSON.parse(s.slice(a,b+1));if(!d.kartlar||!d.kartlar.length)throw 0;
  d.kartlar.forEach(function(c){if(!c.id)c.id=yeniId();if(!c.odemeGunu&&c.sonOdeme)c.odemeGunu=tarihOku(c.sonOdeme).getDate();});
  V.kartlar=d.kartlar;if(d.gelir)V.gelir=Object.assign({},BOS.gelir,d.gelir);if(d.gider)V.gider=Object.assign({},BOS.gider,d.gider);if(d.ayar)V.ayar=Object.assign({},BOS.ayar,d.ayar);if(d.odemeler)V.odemeler=d.odemeler;
  kaydet();kapat();git('ana');toast(d.kartlar.length+' kart yüklendi ✅');}catch(e){toast('Metin okunamadı — tamamını kopyaladığından emin ol');}}
function blobIndir(icerik,ad,tur){var u=URL.createObjectURL(new Blob([icerik],{type:tur}));var a=document.createElement('a');a.href=u;a.download=ad;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(u);a.remove();},4000);}
function yedekIndir(){blobIndir(JSON.stringify(V,null,1),'kart-pusulasi-yedek-'+tarihYaz(bugun())+'.json','application/json');toast('Yedek indirildi 📤');}
function hepsiniSil(){if(!confirm('Bütün kartlar ve ayarlar silinsin mi? Önce yedek almanı öneririm.'))return;var eski=JSON.stringify(V);V=JSON.parse(JSON.stringify(BOS));kaydet();yenile();
  geriAlToast('Veriler silindi',function(){V=JSON.parse(eski);kaydet();yenile();});}
function takvimIndir(){if(!V.kartlar.length){toast('Önce kart ekle');return;}
  var s=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//KartPusulasi//TR','CALSCALE:GREGORIAN'],dt=new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';
  V.kartlar.forEach(function(c){var ilk=sonrakiGun(c.odemeGunu,new Date(bugun().getTime()-864e5)),d=tarihYaz(ilk).replace(/-/g,'');
    s.push('BEGIN:VEVENT','UID:kp-'+c.id+'@kartpusulasi','DTSTAMP:'+dt,'DTSTART;TZID=Europe/Istanbul:'+d+'T090000','DURATION:PT30M','RRULE:FREQ=MONTHLY;BYMONTHDAY='+Math.min(28,c.odemeGunu)+(c.odemeGunu>28?',-1':''),
      'SUMMARY:💳 '+c.banka+' son ödeme günü','DESCRIPTION:Kart Pusulası\'ndan güncel tutarı kontrol et.',
      'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+c.banka+' ödemesi 2 gün sonra','TRIGGER:-P2D','END:VALARM',
      'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+c.banka+' ödemesi bugün','TRIGGER:PT0M','END:VALARM','END:VEVENT');});
  s.push('END:VCALENDAR');blobIndir(s.join('\r\n'),'kart-odemeleri.ics','text/calendar');toast('Takvim dosyası açılıyor 📅');}

/* ---------- kasa ---------- */
function kasaPost(yol,govde){return fetch(kasa()+yol,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(govde)}).then(function(r){return r.json().catch(function(){return{};}).then(function(j){if(!r.ok)throw new Error(j&&(j.hata||j.error)||('k'+r.status));return j;});})
  .catch(function(e){var m=String(e&&e.message||'');if(/sifre|şifre|yetki|401|403/i.test(m))throw new Error('Kasa şifresi yanlış görünüyor');if(!navigator.onLine)throw new Error('İnternet yok, biraz sonra dene');throw new Error('Kasaya şu an ulaşılamadı, biraz sonra tekrar dene');});}
function standalone(){return (window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;}
function b64u8(s){var p='='.repeat((4-s.length%4)%4),b=(s+p).replace(/-/g,'+').replace(/_/g,'/'),r=atob(b),o=new Uint8Array(r.length);for(var i=0;i<r.length;i++)o[i]=r.charCodeAt(i);return o;}
function swKayit(){if(!('serviceWorker' in navigator)||location.protocol!=='https:')return Promise.resolve(null);return navigator.serviceWorker.register('sw.js').catch(function(){return null;});}
function bildirimAc(){
  if(!('Notification' in window)||!('serviceWorker' in navigator)){toast(standalone()?'Bu cihaz bildirim desteklemiyor':'Önce Ana Ekrana Ekle, sonra simgeden aç');if(!standalone())anaEkranYardim();return;}
  if(location.protocol!=='https:'){toast('Bildirim yalnız https adreste çalışır');return;}
  Notification.requestPermission().then(function(p){if(p!=='granted'){toast('İzin verilmedi — Ayarlar\'dan izin verebilirsin');rozet();return;}ls('kp_bild','1');return aboneOl(true);});}
function aboneOl(zorla){
  if(!('serviceWorker' in navigator)||location.protocol!=='https:'||!('Notification' in window)||Notification.permission!=='granted'||ls('kp_bild')==='0')return Promise.resolve();
  var son=+(ls('kp_abone_t')||0);if(!zorla&&Date.now()-son<7*864e5)return Promise.resolve();
  return swKayit().then(function(){return navigator.serviceWorker.ready;}).then(function(reg){return reg.pushManager.getSubscription().then(function(s){return s||reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u8(VAPID)});});})
   .then(function(s){var j=s.toJSON();ls('kp_endpoint',j.endpoint);return kasaPost('/abone',{s:{endpoint:j.endpoint,keys:{p256dh:j.keys.p256dh,auth:j.keys.auth}},rol:'kullanici',ogrId:'',sinif:'',sube:'',ad:'kullanici',uyg:UYG});})
   .then(function(){ls('kp_abone_t',String(Date.now()));if(zorla)toast('Bu cihaz kaydedildi 🔔');rozet();bildirimDurumGoster();})
   .catch(function(e){if(zorla)toast(e.message||'Kayıt yapılamadı');});}
function bildirimKapat(){ls('kp_bild','0');if(!('serviceWorker' in navigator)){rozet();return;}navigator.serviceWorker.getRegistration().then(function(r){return r&&r.pushManager.getSubscription();}).then(function(s){return s&&s.unsubscribe();}).catch(function(){}).then(function(){ls('kp_abone_t','0');toast('Bildirimler kapatıldı 🔕');rozet();bildirimDurumGoster();});}
function bildirimAcikMi(){return 'Notification' in window&&Notification.permission==='granted'&&ls('kp_bild')!=='0'&&!!ls('kp_endpoint');}
function rozet(){var a=bildirimAcikMi();$('bildRozet').textContent=a?'🔔':'🔕';var h=$('hakBild');if(h)h.textContent=a?'🔔 Bildirim açık':'🔕 Bildirim kapalı · aç';}
function bildirimDurumGoster(){var el=$('bildDurum');if(!el)return;var izin='Notification' in window?Notification.permission:'yok',ep=ls('kp_endpoint');
  var sat=function(ok,y){return '<div>'+(ok?'✅':'⛔')+' '+y+'</div>';};
  var h=sat(izin==='granted','Bildirim izni')+sat(standalone(),'Ana ekrandan açıldı')+sat(!!ep&&ls('kp_bild')!=='0','Abonelik');
  el.innerHTML=h+'<div id="kasaKayit">⏳ Kasa kontrol ediliyor…</div>';
  if(!ep){$('kasaKayit').innerHTML='⛔ Kasada kayıt yok';return;}
  kasaPost('/abone/durum',{endpoint:ep,uyg:UYG}).then(function(j){var ben=(j.ben||[]).length;$('kasaKayit').innerHTML=(ben?'✅':'⛔')+' Kasada kayıt'+(j.toplam!=null?' · bu uygulamada toplam '+j.toplam+' cihaz':'');})
   .catch(function(e){$('kasaKayit').innerHTML='⛔ '+esc(e.message);});}
function banaDene(){var ep=ls('kp_endpoint');if(!ep){toast('Önce “Bu cihazı kaydet”');return;}
  var g=JSON.stringify({hedef:{uyg:UYG,rol:['kullanici']},veri:{baslik:'💳 Kart Pusulası · Deneme',govde:'Bildirimler çalışıyor ✅',url:'./#ana',etiket:'deneme'}});
  try{if(navigator.sendBeacon&&navigator.sendBeacon(kasa()+'/olay',new Blob([g],{type:'text/plain'}))){toast('Deneme gönderildi, birkaç saniye bekle 🧪');return;}}catch(e){}
  fetch(kasa()+'/olay',{method:'POST',keepalive:true,headers:{'Content-Type':'text/plain'},body:g}).then(function(){toast('Deneme gönderildi 🧪');}).catch(function(){toast('Kasaya ulaşılamadı');});}
function bildirimleriTemizle(){try{if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.getRegistration().then(function(r){if(r&&r.getNotifications)return r.getNotifications().then(function(l){l.forEach(function(n){n.close();});});}).catch(function(){});if(navigator.clearAppBadge)navigator.clearAppBadge().catch(function(){});}catch(e){}}

/* --- hatırlatmalar --- */
var HL=[];
var ONERILER=[
  {saat:'09:30',gunler:[],baslik:'Kart kontrolü',govde:'Bugün ödemen var mı? Bir bak, içini ferahlat.'},
  {saat:'20:00',gunler:[1],baslik:'Haftalık bütçe',govde:'Bu haftanın ödemelerine 1 dakika göz at.'},
  {saat:'18:00',gunler:[5],baslik:'Hafta sonu öncesi',govde:'Önümüzdeki hafta hangi kartın ödemesi var?'},
  {saat:'21:30',gunler:[],baslik:'Harcama notu',govde:'Bugün kartla ne harcadın? Kart Pusulası\'na işle.'}];
function sifre(){var s=$('hSifre')?$('hSifre').value:ls('kp_sifre');if($('hHatirla')){if($('hHatirla').checked&&s)ls('kp_sifre',s);else if(!$('hHatirla').checked)try{localStorage.removeItem('kp_sifre');}catch(e){}}return s;}
function hatirlatmaYukle(){var s=sifre();if(!s){toast('Kasa şifresini yaz');return;}
  kasaPost('/hatirlatma/liste',{sifre:s,uyg:UYG}).then(function(j){HL=(j.liste||j||[]).filter?(j.liste||j):[];hatirlatmaCiz();toast(HL.length+' hatırlatma geldi');}).catch(function(e){toast(e.message);});}
function hatirlatmaCiz(){var el=$('hListe');if(!el)return;if(!HL.length){el.innerHTML='<p class="soluk">Liste boş.</p>';return;}
  el.innerHTML=HL.map(function(h,i){var oto=String(h.id).indexOf('oto_')===0;return '<div class="hat"><div class="satir ara"><b>'+esc(h.saat)+' · '+esc(h.baslik)+'</b><input type="checkbox" style="width:26px;height:26px" aria-label="Aktif" '+(h.aktif!==false?'checked':'')+' onchange="HL['+i+'].aktif=this.checked"></div>'+
   '<div class="soluk">'+(h.tarih?trTarih(tarihOku(h.tarih),true)+' (kart ödemesi, kendiliğinden)':(h.gunler&&h.gunler.length?h.gunler.map(function(g){return GUNLER[g];}).join(', '):'Her gün'))+'</div>'+
   (oto?'':'<label>Saat</label><input type="time" value="'+esc(h.saat)+'" onchange="HL['+i+'].saat=this.value"><label>Başlık</label><input value="'+esc(h.baslik)+'" onchange="HL['+i+'].baslik=this.value"><label>Metin</label><input value="'+esc(h.govde)+'" onchange="HL['+i+'].govde=this.value">'+
   '<label>Günler (boş = her gün)</label><div class="secim">'+[1,2,3,4,5,6,0].map(function(g){return '<button class="'+((h.gunler||[]).indexOf(g)>=0?'sec':'')+'" onclick="gunSec('+i+','+g+')">'+GUNLER[g].slice(0,3)+'</button>';}).join('')+'</div>')+
   '<div style="height:6px"></div><button class="btnk" style="width:100%" onclick="if(confirm(\'Silinsin mi?\')){HL.splice('+i+',1);hatirlatmaCiz();}">🗑️ Sil</button></div>';}).join('');}
function gunSec(i,g){var a=HL[i].gunler=HL[i].gunler||[],k=a.indexOf(g);if(k>=0)a.splice(k,1);else a.push(g);hatirlatmaCiz();}
function hatirlatmaEkle(){HL.push({id:'h'+Date.now().toString(36),saat:'09:00',gunler:[],baslik:'Hatırlatma',govde:'',url:'./#ana',hedef:{},aktif:true});hatirlatmaCiz();}
function oneriEkle(i){var o=ONERILER[i];HL.push({id:'h'+Date.now().toString(36)+i,saat:o.saat,gunler:o.gunler.slice(),baslik:'💳 Kart Pusulası · '+o.baslik,govde:o.govde,url:'./#ana',hedef:{},aktif:true});hatirlatmaCiz();toast('Eklendi — 💾 Kasaya kaydet\'e dokun');}
function otoListe(){var L=[],b=bugun();olaylar().forEach(function(o){if(o.tip==='gecikti')return;
  [[2,'10:00','2 gün sonra'],[0,'09:00','BUGÜN']].forEach(function(x){var d=new Date(o.tarih.getTime()-x[0]*864e5),f=gunFark(d);if(f<0||f>7)return;
    L.push({id:'oto_'+o.c.id+'_'+tarihYaz(d)+'_'+x[0],saat:x[1],gunler:[d.getDay()],tarih:tarihYaz(d),baslik:'💳 Kart Pusulası · '+o.c.banka,govde:'Son ödeme '+x[2]+' ('+trTarih(o.tarih)+'). Asgariyi kaçırma.',url:'./#ana',hedef:{},aktif:true});});});return L;}
function otoHatirlatma(elle){var s=elle?sifre():ls('kp_sifre');if(!s){if(elle)toast('Kasa şifresini yaz');return Promise.resolve();}
  return kasaPost('/hatirlatma/liste',{sifre:s,uyg:UYG}).then(function(j){var eski=(j.liste||j||[]);if(!eski.filter)eski=[];var el=eski.filter(function(h){return String(h.id).indexOf('oto_')!==0;});
    var yeni=el.concat(otoListe());return kasaPost('/hatirlatma/kaydet',{sifre:s,uyg:UYG,liste:yeni}).then(function(){HL=yeni;ls('kp_oto_t',String(Date.now()));if(elle){hatirlatmaCiz();toast('Ödeme hatırlatmaları kasaya yazıldı ✅');}});})
   .catch(function(e){if(elle)toast(e.message);});}
var otoZ;function otoHatirlatmaPlanla(){clearTimeout(otoZ);if(!ls('kp_sifre'))return;otoZ=setTimeout(function(){otoHatirlatma(false);},4000);}
function hatirlatmaKaydet(){var s=sifre();if(!s){toast('Kasa şifresini yaz');return;}
  kasaPost('/hatirlatma/kaydet',{sifre:s,uyg:UYG,liste:HL}).then(function(){toast('Kasaya kaydedildi 💾');}).catch(function(e){toast(e.message);});}

/* ---------- genel ---------- */
function yazi(d){var f=Math.min(22,Math.max(13,(+(ls('kp_fs')||16))+d));ls('kp_fs',String(f));document.documentElement.style.setProperty('--fs',f+'px');}
function tema(){document.body.classList.toggle('koyu',ls('kp_koyu')==='1');}
function paylas(){var u=location.href.split('#')[0];if(navigator.share)navigator.share({title:'Kart Pusulası',url:u}).catch(function(){});else{try{navigator.clipboard.writeText(u);toast('Link kopyalandı');}catch(e){toast(u);}}}
function anaEkranYardim(){ac('<h2 style="margin-top:0">➕ Ana ekrana ekle</h2><ol><li>Bu sayfayı <b>Safari</b>\'de aç.</li><li>Alttaki <b>Paylaş (□↑)</b> düğmesine dokun.</li><li><b>Ana Ekrana Ekle</b>\'yi seç.</li><li>Ana ekrandaki <b>Kart Pusulası</b> simgesinden aç.</li></ol><button class="btn" onclick="kapat()">Tamam</button>');}
function kasaDegis(){var u=prompt('Kasa adresi',kasa());if(u==null)return;if(u.trim())ls('zkasa_url',u.trim());else try{localStorage.removeItem('zkasa_url');}catch(e){}cizAyarlar();toast('Kaydedildi 💾');}
function yeniliklerGoster(){ac('<h2 style="margin-top:0">🆕 Yeni neler var? (Sürüm '+SURUM+')</h2><ul>'+YENILIKLER.map(function(y){return '<li>'+esc(y)+'</li>';}).join('')+'</ul><button class="btn" onclick="kapat()">Tamam</button>');ls('kp_gorulen_surum',String(SURUM));}
function surumKontrol(){if(location.protocol.indexOf('http')!==0)return;fetch(location.href.split('#')[0].split('?')[0]+'?v='+Date.now(),{cache:'no-store'}).then(function(r){return r.text();}).then(function(t){var m=t.match(/var SURUM=(\d+)/);if(m&&+m[1]>SURUM){var a=document.activeElement;if(a&&/INPUT|TEXTAREA/.test(a.tagName)||$('perde').classList.contains('acik'))$('yeniSurum').style.display='block';else location.reload();}}).catch(function(){});}
function cevrim(){$('cevrim').style.display=navigator.onLine?'none':'block';}
function oneGeldi(){bildirimleriTemizle();surumKontrol();yenile();aboneOl(false);
  if(ls('kp_sifre')&&Date.now()-(+(ls('kp_oto_t')||0))>12*3600e3)otoHatirlatma(false);}
window.addEventListener('online',cevrim);window.addEventListener('offline',cevrim);
document.addEventListener('visibilitychange',function(){if(!document.hidden)oneGeldi();});
window.addEventListener('focus',bildirimleriTemizle);window.addEventListener('pageshow',bildirimleriTemizle);
function hataKarti(){if(document.getElementById('hataK'))return;var d=document.createElement('div');d.id='hataK';d.style.cssText='position:fixed;inset:0;z-index:98;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px';
  d.innerHTML='<div class="k" style="max-width:360px;text-align:center"><h2>😕 Bir sorun oldu</h2><p class="soluk">Verilerin güvende, telefonunda duruyor.</p><button class="btn" onclick="location.reload()">🔄 Yenile</button><div style="height:8px"></div><button class="btn2" style="width:100%" onclick="onbellekTemizle()">🧹 Önbelleği temizleyip yenile</button></div>';document.body.appendChild(d);}
function onbellekTemizle(){var p=[];try{if(window.caches)p.push(caches.keys().then(function(k){return Promise.all(k.map(function(x){return caches.delete(x);}));}));}catch(e){}Promise.all(p).then(function(){location.reload();});}
window.onerror=function(m,src){if(src&&src.indexOf(location.href.split('#')[0].split('?')[0])!==0&&src!=='')return;hataKarti();};
window.addEventListener('unhandledrejection',function(e){/* ağ hataları sessiz geçilir */});

/* ---------- başlat ---------- */
(function(){
  yukle();tema();var f=+(ls('kp_fs')||16);document.documentElement.style.setProperty('--fs',f+'px');cevrim();
  git((location.hash||'#ana').slice(1));
  setTimeout(function(){var a=$('acilis');a.style.opacity='0';setTimeout(function(){a.remove();},300);},600);
  if(location.protocol==='https:')swKayit();
  bildirimleriTemizle();rozet();aboneOl(false);setTimeout(surumKontrol,3000);
  if(ls('kp_sifre')&&Date.now()-(+(ls('kp_oto_t')||0))>12*3600e3)setTimeout(function(){otoHatirlatma(false);},2500);
  var g=+(ls('kp_gorulen_surum')||0);if(g&&g<SURUM)setTimeout(yeniliklerGoster,900);else if(!g)ls('kp_gorulen_surum',String(SURUM));
})();
</script>
